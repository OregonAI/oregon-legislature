name: pages

# Build the landing page + visualizations (src/build_site.py) and deploy ./site/ to Pages.
#
# THIS REPLACED the reusable publish-index caller, and the two must never both exist here.
# That workflow publishes corpus-index.json alone, and its own header says: "Do NOT call
# this from a corpus that already deploys Pages itself — two workflows deploying to one
# Pages site will fight over the `pages` concurrency group."
#
# src/build_site.py therefore owns BOTH jobs: it renders the site and calls the toolkit's
# build_index to emit site/corpus-index.json at the same URL as before. That URL is load-
# bearing for ONE consumer outside this repo: the org landing page reads it for live document
# counts.
#
# CORRECTION: this said "and oregon-records-retention resolves citations INTO this corpus
# through it". IT NEVER DID. That corpus declared exactly one sibling —
# executive-regulatory-frameworks — and registered no scheme pointing here; checked across
# every `siblings:` block and citation module on the platform. oregon-records-retention has
# since been retired entirely, so the named consumer is now doubly absent.
#
# Keep publishing the index anyway: the org page depends on it, and a real inbound consumer
# may appear. But the reason is the org page, not a sibling that was never there.
on:
  push:
    branches: [main]
    # No paths filter, unlike the sibling corpus. The index is derived from every measure
    # file, so any content change must republish it; a filter tuned to the site's inputs
    # would let the published index drift behind the corpus.
  # The nightly ingest changes the corpus without touching this workflow.
  schedule:
    - cron: "40 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # build_site.py emits corpus-index.json via corpus_toolkit.index, so the toolkit is
      # a build dependency here, not just a runtime one.
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the visualizations are not stale
        # viz/*.html is committed. If a measure ingest changed the numbers and nobody re-ran
        # the generators, fail here rather than deploying a chart that disagrees with the
        # corpus it claims to describe.
        #
        # The topic map is checked from its COMMITTED html only — regenerating it needs
        # embeddings (torch + a 2.3 GB model) and a GPU to be quick, neither of which CI has.
        # build_topic_map.py --check reads the embedding artifact, so it is run separately
        # below and skipped when that artifact is absent.
        run: python3 src/build_measure_citations.py --check
      - name: Check the topic map is not stale (only if embeddings are present)
        run: |
          if [ -f _meta/embeddings/meta.json ]; then
            pip install -r requirements-embeddings.txt
            python3 src/build_topic_map.py --check
          else
            echo "no embedding artifact in CI — topic map staleness is gated locally"
          fi
      - name: Build the site
        run: python3 src/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
