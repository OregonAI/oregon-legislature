name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Pinned to v1.2.0, not the template's default v1.0.5: v1.2.0 is the first
  # tagged corpus-toolkit release whose bundled schema
  # (schemas/document.frontmatter.v1.schema.json) recognizes doc_type:
  # entity_doc / dataset_doc and the live_schema_hash field this corpus's
  # entity docs use. An older toolkit-ref would reject every entity doc's
  # doc_type as not in its enum. Note this pins the WORKFLOW FILE version;
  # each reusable workflow also has its own `toolkit-ref` input (documented
  # default v1.0.5 even inside the v1.2.0-tagged workflow file itself) that
  # governs which corpus-toolkit checkout it actually installs and validates
  # against — confirmed by reading corpus-toolkit's validate-frontmatter.yml
  # at both tags. Pass it explicitly rather than relying on the tag alone.
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.31.0
    with:
      toolkit-ref: v1.31.0

  # ENABLED 2026-08-02 (M4). The previous disable comment dated from the v1.2-era
  # corpus, when 3 hash-only entity docs were everything and the gate would green
  # by doing nothing. Today it guards 6,134 measure documents with REAL committed
  # snapshots (15,642 files) and real hashes — measured before enabling: a local
  # run verifies 6,134 full-text sections. The 3 entity docs still pass without
  # assertion; that residue is stated here rather than blocking the rest.
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.31.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.31.0

  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1.31.0
    with:
      toolkit-ref: v1.31.0
      # Same rationale as oregon-records-retention: lychee walks './**/*.md',
      # which would include _meta/templates/entity-doc.md — a skeleton whose
      # placeholder URL is not meant to resolve.
      exclude-paths: |
        _meta/templates
        measures
      # measures/ is EXCLUDED, for two reasons.
      #
      # 1. Verbatim legislative text collides with markdown. Oregon marks deleted
      #    language with square brackets, so extracted bill text contains things like
      #    "[(4)](5)(a) The department may not place..." — which markdown reads as a
      #    link to a file named "5". Five documents hit this today and every future
      #    session will add more. The text CANNOT be escaped: content_mode is verbatim
      #    and verify-provenance checks the full-text section against the snapshot, so
      #    escaping "[" would break a real guarantee to satisfy a cosmetic one.
      #
      # 2. It re-checked the same two hosts 3,758 times per push — 24 minutes of CI to
      #    validate a handful of distinct URLs. Those source URLs are already covered by
      #    something stronger: verify-provenance hashes the bytes actually fetched from
      #    them, which a 200 response does not prove.
      #
      # Authored prose (README, AGENTS, entities/, cookbook/) is still fully checked —
      # that is where a broken link is a human error rather than an artifact of mirroring.
