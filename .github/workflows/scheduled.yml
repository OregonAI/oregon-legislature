name: scheduled
on:
  schedule:
    - cron: "0 14 * * 1"      # weekly Monday: full validation
    - cron: "0 14 1 * *"        # monthly, 1st: drift (corpus-toolkit ADR 0015)
  workflow_dispatch:

jobs:
  # `corpus-detect-changes` (corpus_toolkit/sources/changes.py) only knows how
  # to re-fetch a plain URL and diff its content hash — it has no per-entity
  # $metadata/live_schema_hash comparison logic (that is real, unbuilt step-8
  # work; see cookbook/README.md and AGENTS.md). What it WILL usefully do
  # today: re-fetch the one $metadata source registered in
  # _meta/source-manifest.yml and flag if ITS raw bytes changed at all — a
  # coarse, whole-document "something in the schema moved, go look" signal,
  # not a precise per-entity diff. See source-manifest.yml's own comment for
  # why that hash is raw-byte-level rather than field-level.
  # Drift monthly, not weekly: since corpus-toolkit ADR 0015 a run writes DRIFT.md and
  # files nothing, so nobody is waiting on a weekly result, and the full-validation jobs
  # below are what the release canary relies on being green every week.
  drift:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 1 * *'
    permissions:
      contents: write
      # v1.30.0 opens a PR for STATUS.md instead of pushing to
      # this protected branch. A CALLER's permissions are the
      # ceiling for a reusable workflow, so the toolkit
      # declaring this is not enough on its own.
      pull-requests: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1
